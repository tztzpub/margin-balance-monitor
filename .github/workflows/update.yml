name: Refresh and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      microcap:
        description: Official 866006.RI completed daily closes from workstation
        type: string
        required: false
  schedule:
    # Beijing time: 08:35, 18:35, 22:35, every day.
    - cron: '35 0,10,14 * * *'
permissions:
  contents: read
concurrency:
  group: margin-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate updater and calculations
        run: python -m pytest tests/test_data.py -q
      - name: Refresh public balances
        env:
          MICROCAP_JSON: ${{ inputs.microcap }}
        run: python refresh.py
      - name: Build self-contained page
        run: python build.py
      - name: Save successful data refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/financing_accounts_daily.csv data/market_closes.csv data/status.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public margin balances'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Stage public page
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
